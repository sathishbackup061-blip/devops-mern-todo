name: MERN CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PORT: ${{ secrets.PORT }}
      DATABASE: ${{ secrets.MONGO_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Wait for MongoDB
        run: sleep 10

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Debug Backend Files
        working-directory: ./backend
        run: |
          pwd
          ls -la

      - name: Run Backend Tests
        working-directory: ./backend
        run: npm test

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      # Uncomment if frontend tests exist
      # - name: Run Frontend Tests
      #   working-directory: ./frontend
      #   run: npm test